[package]
name = "the-stocks-app"
version = "1.0.0-beta.2"
description = "A cross-platform desktop stocks application"
authors = ["The Stocks App"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "the_stocks_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-store = "2"
